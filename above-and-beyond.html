  <h1 style="margin:0 0 12px;font-weight:400;font-size:40px;line-height:1.05;color:#161616">What moves together.</h1>
  <p style="margin:0;max-width:820px;font-size:16px;line-height:1.66">This is the Above and Beyond view of Sphere, the monitoring app I built for my own machines and workflow, exported from the running app and drawn by its own chart code. It reads every source Sphere collects at once: Claude Code prompts, the desktop, the Raspberry Pi, the carbon server, the router, the home network, and the phone. It asks which of them rise and fall together, which leads, what kinds of hours and days there are, and how far each finding can be trusted. The plates come from a nightly machine learning run, a grouping tree and k-means over 839 hours, forests with held-out tests, and resampled checks on every claim. The data is a snapshot from the run of November 17, 2026. My own wellness logs (sleep, mood, energy, and productivity) are removed, and one service's name reads &ldquo;redacted&rdquo;; a note at the top of the view says where.</p>
