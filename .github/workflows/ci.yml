name: ci

on:
  push:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gl.tgz
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" -o gl.sums
          grep " gitleaks_8.30.1_linux_x64.tar.gz$" gl.sums | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
          python -m pip install --quiet semgrep==1.186.0 zizmor==1.33.1
      - run: gitleaks git . --redact --no-banner --exit-code 1
      - run: semgrep scan --config p/default --config p/secrets --severity ERROR --error --metrics off --quiet .
      - run: zizmor --offline .github/workflows
